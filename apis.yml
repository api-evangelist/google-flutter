apis:
- name: Pub.dev API
  description: >-
    The Pub.dev API provides programmatic access to the official package
    repository for Dart and Flutter. Developers can search for packages,
    retrieve package metadata and version details, fetch package scores and
    metrics, and access documentation links. This API powers tooling for
    dependency management in Flutter and Dart projects.
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://pub.dev/help/api
  baseURL: https://pub.dev/api
  tags:
  - Packages
  - Dependencies
  - Registry
  properties:
  - type: Documentation
    url: https://pub.dev/help/api
  - type: OpenAPI
    url: openapi/flutter-pub-dev-openapi.yml
  - type: JSONSchema
    url: json-schema/google-flutter-pub-package-schema.json
- name: Dart Analysis Server Protocol
  description: >-
    The Dart Analysis Server provides a JSON-based protocol for IDE integration,
    enabling code analysis, completion, navigation, refactoring, and diagnostics
    for Dart and Flutter projects. It powers editor features in VS Code, IntelliJ,
    and other supported editors through a language server protocol.
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://htmlpreview.github.io/?https://github.com/dart-lang/sdk/blob/main/pkg/analysis_server/doc/api.html
  baseURL: https://localhost
  tags:
  - Code Analysis
  - IDE
  - Language Server
  properties:
  - type: Documentation
    url: https://github.com/dart-lang/sdk/blob/main/pkg/analysis_server/doc/api.html
